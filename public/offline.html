<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1220">
  <title>Offline · Centresidence</title>
  <style>
    :root { --navy:#0B1220; --navy-2:#0d1b3a; --cyan:#2EA6E6; --cyan-2:#1CE0F5; --ink:#e7eefb; --muted:#8fa3c4; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 75% -10%, rgba(46,166,230,.18), transparent 60%),
        radial-gradient(900px 500px at 10% 110%, rgba(28,224,245,.10), transparent 55%),
        linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 60%, var(--navy) 100%);
      display: grid; place-items: center; padding: 24px; text-align: center;
    }
    .card { max-width: 420px; width: 100%; }
    .logo { width: 96px; height: 96px; border-radius: 22px; margin: 0 auto 26px;
            box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(46,166,230,.18); display: block; }
    h1 { font-size: 26px; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.01em; }
    p { color: var(--muted); font-size: 15px; line-height: 1.55; margin: 0 auto 28px; max-width: 340px; }
    .btn {
      appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 15px;
      color: #061018; padding: 13px 26px; border-radius: 12px;
      background: linear-gradient(135deg, var(--cyan-2), var(--cyan));
      box-shadow: 0 10px 26px rgba(46,166,230,.35); transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 32px rgba(46,166,230,.45); }
    .btn:active { transform: translateY(0); }
    .tag { margin-top: 40px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #5f7096; }
    .tag b { color: var(--cyan); font-weight: 600; }
    .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--muted); margin:0 7px; vertical-align:middle; }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/pwa/icon-192.png" alt="Centresidence" width="96" height="96">
    <h1>You're offline</h1>
    <p>We can't reach Centresidence right now. Your data is safe — check your connection and try again.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
    <div class="tag">Real&nbsp;Estate<span class="dot"></span>Simplified<span class="dot"></span><b>Connected</b></div>
  </main>
  <script>
    // Auto-retry the moment connectivity returns.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
